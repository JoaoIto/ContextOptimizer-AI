
version: "1.0"
workspace:
  name: "e-commerce-suite"
  description: "Ambiente de desenvolvimento local"
services:
  postgres-db:
    type: docker
    image: "postgres:15-alpine"
  auth-api:
    type: local
    dir: "."
    run: "node -e 'console.log(\"Auth API running...\"); setInterval(() => {}, 1000);'"
    depends_on:
      postgres-db:
        condition: service_healthy
